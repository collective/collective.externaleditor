# Generated from:
# https://github.com/plone/meta/tree/master/config/default
# See the inline comments on how to expand/tweak this configuration file
name: Meta
on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

##
# To set environment variables for all jobs, add in .meta.toml:
# [github]
# env = """
#     debug: 1
#     image-name: 'org/image'
#     image-tag: 'latest'
# """
##

jobs:
  qa:
    uses: plone/meta/.github/workflows/qa.yml@main
  coverage:
    uses: plone/meta/.github/workflows/coverage.yml@main
  release_ready:
    uses: plone/meta/.github/workflows/release_ready.yml@main

##
# To modify the list of default jobs being created add in .meta.toml:
# [github]
# jobs = [
#    "qa",
#    "test",
#    "coverage",
#    "dependencies",
#    "release_ready",
#    "circular",
#    ]
##

##
# To request that some OS level dependencies get installed
# when running tests/coverage jobs, add in .meta.toml:
# [github]
# os_dependencies = "git libxml2 libxslt"
##

  test-plone62:
    name: Plone 6.2 on Python 3.13
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uvx --with tox-uv tox -e test-plone62

##
# Specify additional jobs in .meta.toml:
#  [github]
#  extra_lines = """
#  another:
#    uses: org/repo/.github/workflows/file.yml@main
#  """
##
